<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APJ AI | Cognitive Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-dot"></span>
                    <h1>APJ AI</h1>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <label>Sessions</label>
                    <ul id="session-list">
                        <li class="active"><i class="bi bi-chat-left-text"></i> Initial Foundation</li>
                    </ul>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="stats-panel">
                    <div class="stat-item">
                        <span class="stat-label">Memories</span>
                        <span id="memory-count" class="stat-value">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Reflections</span>
                        <span id="reflection-count" class="stat-value">--</span>
                    </div>
                </div>
                <div class="status-indicator">
                    <span class="status-dot online"></span>
                    <span id="active-model">Qwen 2.5 3B</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="chat-container">
            <header class="chat-header">
                <div class="header-info">
                    <h2 id="current-session-name">Welcome To APJ AI</h2>
                    <span class="badge cognitive-badge">built by Navonil</span>
                </div>
                <div class="header-actions">
                    <button id="export-pdf-btn" class="btn btn-icon" title="Export to PDF"><i class="bi bi-file-earmark-pdf"></i></button>
                    <button id="clear-chat-btn" class="btn btn-icon" title="Clear Chat"><i class="bi bi-trash"></i></button>
                    <button class="btn btn-icon" title="Settings"><i class="bi bi-gear"></i></button>
                </div>
            </header>

            <div id="chat-history" class="chat-history">
                <!-- Messages will be injected here -->
                <div class="message assistant welcome-message">
                    <div class="message-content">
                        Welcome to <strong>APJ AI</strong><br>
                        <small class="creator-tag">built by Navonil</small>
                    </div>
                </div>
            </div>

            <div class="chat-input-wrapper">
                <div id="retrieval-indicator" class="retrieval-indicator hidden">
                    <i class="bi bi-cpu"></i> <span id="retrieval-status">Retrieving context...</span>
                </div>
                <div class="input-area">
                    <textarea id="user-input" placeholder="Ask me anything..." rows="1"></textarea>
                    <button id="send-btn" class="btn btn-primary send-btn">
                        <i class="bi bi-arrow-up"></i>
                    </button>
                </div>
                <div class="input-footer">
                    <span>Press Enter to send, Shift + Enter for new line</span>
                </div>
            </div>
        </main>

        <!-- Info Panel (Subtle) -->
        <aside class="info-panel">
            <div class="panel-section">
                <label><i class="bi bi-layers"></i> Routing Metadata</label>
                <div id="routing-info" class="meta-card">
                    <div class="meta-row">
                        <span>Route:</span>
                        <span id="meta-route">--</span>
                    </div>
                    <div class="meta-row">
                        <span>Complexity:</span>
                        <span id="meta-complexity">--</span>
                    </div>
                    <div class="meta-row">
                        <span>Model:</span>
                        <span id="meta-model">--</span>
                    </div>
                    <div class="meta-row">
                        <span>Provider:</span>
                        <span id="meta-provider">--</span>
                    </div>
                </div>
            </div>
            <div class="panel-section">
                <label><i class="bi bi-bookmark-star"></i> Key Grounding</label>
                <div id="grounding-list" class="grounding-list">
                    <div class="empty-state">No context active</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        window.BACKEND_URL = "{{ backend_url }}";
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
